<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>bhatti · mon</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #0f131b;
    --card: #0c1119;
    --track: #05070b;
    --border: #222a36;
    --border-faint: #171d27;
    --fg: #d5dde8;
    --muted: #7a8699;
    --accent: #63d3e0;
    --accent-dim: #2f6b74;
    --green: #54d16a;
    --amber: #e3b341;
    --orange: #f0883e;
    --red: #f26d6d;
    --slate: #5a6a80;
    --load: linear-gradient(90deg, #2ea043 0%, #54d16a 30%, #e3b341 62%, #f0883e 80%, #f26d6d 100%);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    -webkit-font-smoothing: antialiased;
  }

  /* token prompt (shown only on 401) */
  .tokenbar { display: none; padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--border); gap: 8px; align-items: center; }
  .tokenbar.show { display: flex; }
  .tokenbar span { color: var(--amber); font-size: 12px; }
  .tokenbar input { flex: 1; background: var(--track); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font: inherit; }
  .tokenbar button { background: var(--accent); color: #06121f; border: 0; border-radius: 6px; padding: 6px 14px; font: inherit; font-weight: 700; cursor: pointer; }

  #mon { padding: 18px 14px 22px; max-width: 1600px; margin: 0 auto; }

  /* btop-style boxed panels: thin border with a bracketed title on the top edge */
  .panel { position: relative; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); margin-bottom: 18px; }
  .panel > .pt {
    position: absolute; top: -8px; left: 12px; padding: 0 7px; background: var(--bg);
    color: var(--accent); font-size: 11px; letter-spacing: 1.2px; text-transform: lowercase; white-space: nowrap;
  }
  .panel > .pt::before { content: "┤ "; color: var(--border); }
  .panel > .pt::after  { content: " ├"; color: var(--border); }

  /* meter: full-width load gradient, dark cover over the unfilled tail, faint block segmentation on top */
  .meter { position: relative; height: 12px; border-radius: 3px; overflow: hidden; background: var(--load); box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); }
  .meter::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: calc((100 - var(--v, 0)) * 1%); background: var(--track); z-index: 1; transition: width .3s cubic-bezier(.22,1,.36,1); }
  .meter::before { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; background: repeating-linear-gradient(90deg, transparent 0 4px, var(--bg) 4px 5px); opacity: .35; }

  /* top strip — host overall gauges */
  .strip { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding: 12px 14px 8px; }
  .block b { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .block i { color: var(--muted); font-style: normal; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; margin-left: 7px; }
  .pills { display: flex; gap: 8px; }
  .pill { display: inline-flex; gap: 6px; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: 11px; border: 1px solid var(--border); color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .pill b { font-weight: 700; font-variant-numeric: tabular-nums; }
  .pill.hot  { color: var(--green); border-color: #2f6b3d; background: #101c13; }
  .pill.warm { color: var(--amber); border-color: #6b5a2f; background: #1d1810; }
  .pill.cold { color: var(--slate); border-color: #2c3646; background: #111823; }
  .gauge { display: flex; align-items: center; gap: 9px; min-width: 220px; }
  .gauge .gl { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; width: 26px; }
  .gauge .meter { flex: 1; }
  .gauge .gv { font-variant-numeric: tabular-nums; font-size: 12px; min-width: 78px; text-align: right; }
  .conn { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 7px var(--green); }
  .dot.stale { background: var(--amber); box-shadow: 0 0 7px var(--amber); }
  .dot.down  { background: var(--red);   box-shadow: 0 0 7px var(--red); }

  /* sandbox cards — btop process rows, tiled */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 8px; padding: 14px 12px 12px; }
  .card { border: 1px solid var(--border); border-radius: 6px; background: var(--card); padding: 8px 11px; cursor: pointer; transition: border-color .12s ease, background .12s ease; }
  .card:hover { border-color: var(--accent-dim); }
  .card.sel { border-color: var(--accent); background: #0d1620; box-shadow: inset 3px 0 0 var(--accent); }
  .card .top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .card .nm { font-weight: 600; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .card .meta { margin-left: auto; color: var(--muted); font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .chip { flex: 0 0 auto; font-size: 10px; padding: 1px 7px; border-radius: 4px; text-transform: uppercase; letter-spacing: .6px; border: 1px solid; }
  .chip.hot  { color: var(--green); border-color: #2f6b3d; background: #101c13; }
  .chip.warm { color: var(--amber); border-color: #6b5a2f; background: #1d1810; }
  .chip.cold { color: var(--slate); border-color: #2c3646; background: #111823; }
  .card .line { display: grid; grid-template-columns: 34px 1fr 74px 92px; align-items: center; gap: 9px; margin-top: 4px; }
  .card .line .k { color: var(--muted); font-size: 10px; letter-spacing: .6px; }
  .card .line .meter { height: 11px; }
  .card .line .v { font-variant-numeric: tabular-nums; font-size: 11px; text-align: right; }
  .card canvas.spark { width: 92px; height: 20px; display: block; }

  /* log explorer */
  .log-head { position: absolute; top: -9px; right: 12px; }
  .clear { background: var(--card); color: var(--accent); border: 1px solid var(--accent-dim); border-radius: 5px; padding: 1px 8px; font: inherit; font-size: 11px; cursor: pointer; }
  .clear:hover { background: #10202a; }
  .log { max-height: 340px; overflow: auto; font-size: 12px; padding-bottom: 2px; }
  .log .row { display: grid; grid-template-columns: 152px 128px 132px 1fr; gap: 12px; padding: 4px 13px; border-bottom: 1px solid var(--border-faint); white-space: nowrap; }
  .log .row:last-child { border-bottom: none; }
  .log .row:hover { background: #0e131b; }
  .log .ts { color: var(--muted); font-variant-numeric: tabular-nums; }
  .log .ty { font-weight: 600; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .log .ty.ok { color: var(--green); }
  .log .ty.err { color: var(--red); }
  .log .ty.warn { color: var(--amber); }
  .log .ty.info { color: var(--accent); }
  .log .ty.mut { color: var(--muted); }
  .log .sb { color: var(--accent-dim); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .log .mt { color: var(--muted); overflow: hidden; text-overflow: ellipsis; min-width: 0; }

  .empty { color: var(--muted); padding: 16px 14px; font-size: 12px; }

  /* thin scrollbar to match the dense aesthetic */
  .log::-webkit-scrollbar { width: 9px; height: 9px; }
  .log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  .log::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; }
    .card .line { grid-template-columns: 30px 1fr 60px 70px; gap: 6px; }
    .card canvas.spark { width: 70px; }
    .log .row { grid-template-columns: 92px 96px 1fr; }
    .log .mt { display: none; }
    .gauge { min-width: 160px; }
  }
</style>
</head>
<body>
<!-- read-only observability monitor — self-contained SPA, no CDN, no deps -->

<div class="tokenbar" id="tokenbar">
  <span>API token required</span>
  <input id="tokenInput" type="password" placeholder="paste bearer token" />
  <button id="tokenSave">save</button>
</div>

<main id="mon">
  <section class="panel">
    <span class="pt">host</span>
    <div class="strip">
      <div class="block"><b id="hTotal">0</b><i>sandboxes</i></div>
      <div class="pills">
        <span class="pill hot"><b id="hHot">0</b> hot</span>
        <span class="pill warm"><b id="hWarm">0</b> warm</span>
        <span class="pill cold"><b id="hCold">0</b> cold</span>
      </div>
      <div class="gauge">
        <span class="gl">cpu</span>
        <div class="meter" id="hCpuMeter" style="--v:0"></div>
        <span class="gv" id="hCpuVal">0%</span>
      </div>
      <div class="gauge">
        <span class="gl">rss</span>
        <div class="meter" id="hMemMeter" style="--v:0"></div>
        <span class="gv" id="hMemVal">0 B</span>
      </div>
      <div class="conn"><span class="dot" id="dot"></span><span id="stat">connecting…</span></div>
    </div>
  </section>

  <section class="panel">
    <span class="pt">sandboxes</span>
    <div class="grid" id="grid"></div>
    <div class="empty" id="gridEmpty">waiting for daemon…</div>
  </section>

  <section class="panel">
    <span class="pt" id="logTitle">log</span>
    <div class="log-head"><button class="clear" id="clearFilter" hidden>✕ clear filter</button></div>
    <div class="log" id="log"></div>
    <div class="empty" id="logEmpty">no events</div>
  </section>
</main>

<script>
(function () {
  "use strict";

  /* ── auth (UNCHANGED from the prior page): the dashboard reuses the caller's
     bearer token. #token=… in the URL fragment wins, is persisted to
     localStorage, then stripped from the address bar; otherwise localStorage. ── */
  var TOKEN_KEY = "bhatti_token";
  function readHashToken() {
    var m = /(?:^|[#&])token=([^&]+)/.exec(location.hash || "");
    if (m) {
      var t = decodeURIComponent(m[1]);
      try { localStorage.setItem(TOKEN_KEY, t); } catch (e) {}
      history.replaceState(null, "", location.pathname + location.search);
      return t;
    }
    try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; }
  }
  var token = readHashToken();

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    dot: $("dot"), stat: $("stat"),
    hTotal: $("hTotal"), hHot: $("hHot"), hWarm: $("hWarm"), hCold: $("hCold"),
    hCpuMeter: $("hCpuMeter"), hCpuVal: $("hCpuVal"), hMemMeter: $("hMemMeter"), hMemVal: $("hMemVal"),
    grid: $("grid"), gridEmpty: $("gridEmpty"),
    log: $("log"), logEmpty: $("logEmpty"), logTitle: $("logTitle"), clear: $("clearFilter"),
    tokenbar: $("tokenbar"), tokenInput: $("tokenInput"), tokenSave: $("tokenSave"),
  };

  // token save (UNCHANGED behavior): persist and re-poll immediately.
  els.tokenSave.addEventListener("click", function () {
    token = els.tokenInput.value.trim();
    try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
    els.tokenbar.classList.remove("show");
    tick();
  });
  els.clear.addEventListener("click", function () { setFilter(null); });

  /* ── state ── */
  var cards = new Map();           // id -> refs
  var hist = Object.create(null);  // id -> {cpu:[], rss:[]}  (ring buffers, ~60 samples)
  var knownEvents = [];            // deduped, newest-first, capped
  var filterId = null;
  var logSig = "";

  /* ── helpers ── */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function clamp(v, a, b) { v = +v || 0; return v < a ? a : v > b ? b : v; }
  function fmtNum(n) { n = +n || 0; return n % 1 === 0 ? String(n) : n.toFixed(1); }
  function humanBytes(n) {
    n = +n || 0;
    if (n < 1024) return n + " B";
    var u = ["KiB", "MiB", "GiB", "TiB", "PiB"], i = -1;
    do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
    return (n >= 100 ? n.toFixed(0) : n.toFixed(1)) + " " + u[i];
  }
  function fmtDur(s) {
    s = Math.max(0, Math.floor(+s || 0));
    var d = Math.floor(s / 86400); s -= d * 86400;
    var h = Math.floor(s / 3600); s -= h * 3600;
    var m = Math.floor(s / 60); s -= m * 60;
    if (d) return d + "d" + h + "h";
    if (h) return h + "h" + m + "m";
    if (m) return m + "m" + s + "s";
    return s + "s";
  }
  function uptimeOf(sb) {
    if (sb.uptime_s != null && +sb.uptime_s > 0) return +sb.uptime_s;
    var t = Date.parse(sb.created_at || "");
    return t ? Math.max(0, (Date.now() - t) / 1000) : 0;
  }
  function loadColor(v) {
    v = +v || 0;
    return v >= 90 ? "#f26d6d" : v >= 75 ? "#f0883e" : v >= 50 ? "#e3b341" : "#54d16a";
  }
  function hexA(h, a) {
    if (typeof h !== "string" || h[0] !== "#" || h.length < 7) return h;
    return "rgba(" + parseInt(h.slice(1, 3), 16) + "," + parseInt(h.slice(3, 5), 16) + "," + parseInt(h.slice(5, 7), 16) + "," + a + ")";
  }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function fmtTs(iso) {
    var d = new Date(iso);
    if (isNaN(+d)) return String(iso || "").replace("T", " ").replace(/\..*$/, "");
    return pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
  }
  function evClass(t) {
    t = (t || "").toLowerCase();
    if (/(err|fail|deny|denied|reject|panic|crash|fatal|timeout|oom|drop)/.test(t)) return "err";
    if (/(stop|pause|delete|destro|remove|kill|shutdown|evict|expire|cold)/.test(t)) return "warn";
    if (/(create|start|resume|wake|boot|ready|restore|snapshot|register|connect|warm|hot)/.test(t)) return "ok";
    if (/(thermal|migrat|scale|config|update|proxy|metric)/.test(t)) return "info";
    return "mut";
  }
  function metaPreview(m) {
    if (!m || typeof m !== "object") return "";
    var out = [], k;
    for (k in m) {
      if (!Object.prototype.hasOwnProperty.call(m, k)) continue;
      if (out.length >= 3) break;
      var v = m[k];
      if (v && typeof v === "object") v = JSON.stringify(v);
      out.push(k + "=" + v);
    }
    return out.join("  ");
  }
  function setText(el, val) { if (el && el.__v !== val) { el.__v = val; el.textContent = val; } }
  function ring(arr, v) { arr.push(v); if (arr.length > 60) arr.shift(); }
  function maxOf(arr) { var m = 0; for (var i = 0; i < arr.length; i++) if (arr[i] > m) m = arr[i]; return m; }

  /* ── tiny inline sparkline (canvas, redrawn per poll) ── */
  function drawSpark(cv, arr, max, color) {
    var dpr = window.devicePixelRatio || 1;
    var w = cv.clientWidth || 92, h = cv.clientHeight || 20;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    var ctx = cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    var n = arr.length;
    if (!n) return;
    max = max || 1;
    var stepX = n > 1 ? w / (n - 1) : 0;
    function y(v) { return h - clamp(v / max, 0, 1) * (h - 2) - 1; }
    // filled area
    ctx.beginPath();
    ctx.moveTo(0, h);
    for (var i = 0; i < n; i++) ctx.lineTo(i * stepX, y(arr[i]));
    ctx.lineTo((n - 1) * stepX, h);
    ctx.closePath();
    ctx.fillStyle = hexA(color, 0.14);
    ctx.fill();
    // line
    ctx.beginPath();
    for (i = 0; i < n; i++) { var x = i * stepX, yy = y(arr[i]); if (i === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy); }
    ctx.lineWidth = 1.25;
    ctx.lineJoin = "round";
    ctx.strokeStyle = color;
    ctx.stroke();
    // head dot
    if (n) { ctx.beginPath(); ctx.arc((n - 1) * stepX, y(arr[n - 1]), 1.4, 0, 6.29); ctx.fillStyle = color; ctx.fill(); }
  }

  /* ── sandbox cards ── */
  function buildCard(sb) {
    var root = document.createElement("div");
    root.className = "card";
    root.innerHTML =
      '<div class="top"><span class="chip"></span><span class="nm"></span><span class="meta"></span></div>' +
      '<div class="line cpu"><span class="k">CPU</span><div class="meter" style="--v:0"></div><span class="v pv">0%</span><canvas class="spark"></canvas></div>' +
      '<div class="line mem"><span class="k">MEM</span><div class="meter" style="--v:0"></div><span class="v mv">0 B</span><canvas class="spark"></canvas></div>';
    var refs = {
      root: root,
      chip: root.querySelector(".chip"),
      nm: root.querySelector(".nm"),
      meta: root.querySelector(".meta"),
      cpuMeter: root.querySelector(".cpu .meter"),
      cpuVal: root.querySelector(".pv"),
      cpuSpark: root.querySelector(".cpu canvas"),
      memMeter: root.querySelector(".mem .meter"),
      memVal: root.querySelector(".mv"),
      memSpark: root.querySelector(".mem canvas"),
    };
    root.addEventListener("click", function () { setFilter(filterId === sb.id ? null : sb.id); });
    return refs;
  }

  function updateCard(refs, sb) {
    var th = sb.thermal || "cold";
    if (refs.chip.__c !== th) { refs.chip.__c = th; refs.chip.className = "chip " + th; }
    setText(refs.chip, th);
    setText(refs.nm, sb.name || sb.id || "—");
    setText(refs.meta, (sb.status || "") + " · " + fmtNum(sb.cpus) + " vCPU · " + (sb.ip || "—") + " · up " + fmtDur(uptimeOf(sb)));

    var cpu = clamp(sb.cpu_pct, 0, 100);
    refs.cpuMeter.style.setProperty("--v", cpu.toFixed(0));
    refs.cpuVal.style.color = loadColor(cpu);
    setText(refs.cpuVal, cpu.toFixed(0) + "%");

    var alloc = (+sb.memory_mb || 0) * 1048576;
    var rss = +sb.rss_bytes || 0;
    var memPct = alloc > 0 ? clamp(rss / alloc * 100, 0, 100) : 0;
    refs.memMeter.style.setProperty("--v", memPct.toFixed(0));
    setText(refs.memVal, humanBytes(rss) + " / " + humanBytes(alloc));

    var h = hist[sb.id] || (hist[sb.id] = { cpu: [], rss: [] });
    ring(h.cpu, cpu);
    ring(h.rss, rss);
    drawSpark(refs.cpuSpark, h.cpu, 100, loadColor(cpu));
    drawSpark(refs.memSpark, h.rss, Math.max(alloc, maxOf(h.rss)) || 1, "#63d3e0");
  }

  function renderSandboxes(sbs) {
    var byId = Object.create(null), ids = [], i, sb;
    for (i = 0; i < sbs.length; i++) { sb = sbs[i]; if (!sb || sb.id == null) continue; byId[sb.id] = sb; ids.push(sb.id); }

    // drop departed sandboxes (and their history / any active filter)
    cards.forEach(function (refs, cid) {
      if (!(cid in byId)) {
        refs.root.remove(); cards.delete(cid); delete hist[cid];
        if (filterId === cid) setFilter(null);
      }
    });

    ids.sort(function (a, b) { return String(byId[a].name || a).localeCompare(String(byId[b].name || b)); });

    // create/update in place + reorder minimally (no full re-render, no flicker)
    for (i = 0; i < ids.length; i++) {
      var id = ids[i], refs = cards.get(id);
      if (!refs) { refs = buildCard(byId[id]); cards.set(id, refs); }
      updateCard(refs, byId[id]);
      if (els.grid.children[i] !== refs.root) els.grid.insertBefore(refs.root, els.grid.children[i] || null);
      refs.root.classList.toggle("sel", !!filterId && id === filterId);
    }

    var empty = ids.length === 0;
    els.grid.hidden = empty;
    els.gridEmpty.hidden = !empty;
  }

  /* ── log explorer ── */
  function mergeEvents(evs) {
    if (!evs || !evs.length) return;
    var seen = Object.create(null), i;
    for (i = 0; i < knownEvents.length; i++) if (knownEvents[i].id != null) seen[knownEvents[i].id] = 1;
    for (i = 0; i < evs.length; i++) {
      var e = evs[i]; if (!e) continue;
      if (e.id == null || !seen[e.id]) { if (e.id != null) seen[e.id] = 1; knownEvents.push(e); }
    }
    knownEvents.sort(function (a, b) {
      var ta = Date.parse(a.ts) || 0, tb = Date.parse(b.ts) || 0;
      if (tb !== ta) return tb - ta;
      return (b.id || 0) - (a.id || 0);
    });
    if (knownEvents.length > 400) knownEvents.length = 400;
  }

  function renderLog() {
    var list = filterId ? knownEvents.filter(function (e) { return e.sandbox_id === filterId; }) : knownEvents;
    var sig = filterId + "|" + (knownEvents.length ? knownEvents[0].id : "-") + "|" + knownEvents.length + "|" + list.length;
    if (sig === logSig) return; // nothing new & same filter → don't touch the DOM
    logSig = sig;

    if (!list.length) {
      els.log.hidden = true; els.logEmpty.hidden = false;
      els.logEmpty.textContent = filterId ? "no events for this sandbox" : "no events";
      return;
    }
    els.log.hidden = false; els.logEmpty.hidden = true;
    var top = els.log.scrollTop, html = "", i;
    for (i = 0; i < list.length; i++) {
      var e = list[i];
      html +=
        '<div class="row">' +
          '<span class="ts">' + esc(fmtTs(e.ts)) + "</span>" +
          '<span class="ty ' + evClass(e.type) + '">' + esc(e.type) + "</span>" +
          '<span class="sb">' + esc(e.sandbox_id || "—") + "</span>" +
          '<span class="mt">' + esc(metaPreview(e.meta)) + "</span>" +
        "</div>";
    }
    els.log.innerHTML = html;
    els.log.scrollTop = top; // preserve scroll across rebuilds
  }

  function setFilter(id) {
    filterId = id || null;
    cards.forEach(function (refs, cid) { refs.root.classList.toggle("sel", !!filterId && cid === filterId); });
    if (filterId) {
      var refs = cards.get(filterId);
      setText(els.logTitle, "log · " + ((refs && refs.nm.__v) || filterId));
      els.clear.hidden = false;
      if (refs) refs.root.scrollIntoView({ block: "nearest", behavior: "smooth" });
    } else {
      setText(els.logTitle, "log");
      els.clear.hidden = true;
    }
    logSig = ""; // force the filtered rebuild
    renderLog();
  }

  /* ── top strip ── */
  function renderStrip(sum, sbs) {
    var bt = (sum && sum.by_thermal) || {};
    setText(els.hTotal, String((sum && sum.total != null ? sum.total : sbs.length) || 0));
    setText(els.hHot, String(bt.hot || 0));
    setText(els.hWarm, String(bt.warm || 0));
    setText(els.hCold, String(bt.cold || 0));

    var i, cSum = 0, allocSum = 0;
    for (i = 0; i < sbs.length; i++) { cSum += clamp(sbs[i].cpu_pct, 0, 100); allocSum += (+sbs[i].memory_mb || 0) * 1048576; }
    var cpuAvg = sbs.length ? clamp(cSum / sbs.length, 0, 100) : 0;
    els.hCpuMeter.style.setProperty("--v", cpuAvg.toFixed(0));
    els.hCpuVal.style.color = loadColor(cpuAvg);
    setText(els.hCpuVal, cpuAvg.toFixed(0) + "%");

    var hostRss = sum && sum.rss_bytes != null ? +sum.rss_bytes : 0;
    els.hMemMeter.style.setProperty("--v", (allocSum > 0 ? clamp(hostRss / allocSum * 100, 0, 100) : 0).toFixed(0));
    setText(els.hMemVal, humanBytes(hostRss));
  }

  function render(data) {
    var sbs = (data && data.sandboxes) || [];
    renderStrip((data && data.summary) || {}, sbs);
    renderSandboxes(sbs);
    mergeEvents((data && data.events) || []);
    renderLog();
  }

  function setStatus(state, text) {
    els.dot.className = "dot" + (state === "live" ? "" : " " + state);
    setText(els.stat, text);
  }

  /* ── poll (fetch + auth UNCHANGED; cadence ~1.5s per spec) ── */
  function tick() {
    var headers = {};
    if (token) headers["Authorization"] = "Bearer " + token;
    fetch("/dashboard/data", { headers: headers, cache: "no-store" })
      .then(function (r) {
        if (r.status === 401) {
          setStatus("down", "unauthorized — paste API token");
          els.tokenbar.classList.add("show");
          throw new Error("unauthorized");
        }
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        els.tokenbar.classList.remove("show");
        setStatus("live", "live · " + new Date().toLocaleTimeString());
        render(data);
      })
      .catch(function (err) {
        if (err.message !== "unauthorized") setStatus("stale", "stale · " + err.message);
      });
  }

  tick();
  setInterval(tick, 1500);
})();
</script>
</body>
</html>
